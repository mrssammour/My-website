<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sammour Calculator</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #2b2b2b;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
    }
    h1 {
        color: #FFD700;
        margin-bottom: 20px;
        text-align: center;
    }
    .input-group {
        margin-bottom: 15px;
        width: 100%;
        max-width: 400px;
        display: flex;
        justify-content: space-between;
    }
    label {
        margin-right: 10px;
    }
    input, select {
        flex: 1;
        padding: 5px;
        font-size: 16px;
        border-radius: 5px;
        border: none;
    }
    button {
        padding: 10px 20px;
        background-color: #FFD700;
        color: black;
        font-weight: bold;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 15px;
    }
    #result {
        margin-top: 20px;
        max-width: 400px;
        width: 100%;
        background-color: #1b1b1b;
        padding: 15px;
        border-radius: 8px;
        line-height: 1.6;
    }
</style>
</head>
<body>

<h1>Sammour Calculator</h1>

<div class="input-group">
    <label for="gold24">24K Gold (g):</label>
    <input type="number" id="gold24" placeholder="0">
</div>

<div class="input-group">
    <label for="gold21">21K Gold (g):</label>
    <input type="number" id="gold21" placeholder="0">
</div>

<div class="input-group">
    <label for="silver">Silver (kg):</label>
    <input type="number" id="silver" placeholder="0">
</div>

<div class="input-group">
    <label for="currency">Currency:</label>
    <select id="currency">
        <option value="USD" selected>USD</option>
        <option value="QAR">QAR</option>
        <option value="SAR">SAR</option>
        <option value="JOD">JOD</option>
    </select>
</div>

<button onclick="calculate()">Calculate Now</button>

<div id="result">
    Prices will appear here.
</div>

<script>
const conversionRates = {
    "USD": 1.0,
    "QAR": 3.64,
    "SAR": 3.75,
    "JOD": 0.71
};

async function fetchPrices() {
    try {
        const currency = document.getElementById("currency").value;
        const rate = conversionRates[currency];

        // Fetch gold price
        const goldResponse = await fetch("https://api.gold-api.com/price/XAU");
        const goldData = await goldResponse.json();
        const gold_oz_usd = goldData.price * rate;
        const gold24_per_g = gold_oz_usd / 31.1035;
        const gold21_per_g = gold24_per_g * 21 / 24;

        // Fetch silver price
        const silverResponse = await fetch("https://api.gold-api.com/price/XAG");
        const silverData = await silverResponse.json();
        const silver_oz_usd = silverData.price * rate;
        const silver_per_kg = (silver_oz_usd / 31.1035) * 1000;

        return { gold24_per_g, gold21_per_g, silver_per_kg, gold_oz_usd, silver_oz_usd };
    } catch (err) {
        console.error("Failed to fetch prices", err);
        return { gold24_per_g:0, gold21_per_g:0, silver_per_kg:0, gold_oz_usd:0, silver_oz_usd:0 };
    }
}

async function calculate() {
    const gold24Input = parseFloat(document.getElementById("gold24").value) || 0;
    const gold21Input = parseFloat(document.getElementById("gold21").value) || 0;
    const silverInput = parseFloat(document.getElementById("silver").value) || 0;
    const currency = document.getElementById("currency").value;
    const symbol = currency === "USD" ? "$" : currency + " ";

    const prices = await fetchPrices();

    const totalGold24 = gold24Input * prices.gold24_per_g;
    const totalGold21 = gold21Input * prices.gold21_per_g;
    const totalSilver = silverInput * prices.silver_per_kg;
    const totalValue = totalGold24 + totalGold21 + totalSilver;

    document.getElementById("result").innerHTML = `
        Gold 24K per gram: ${symbol}${prices.gold24_per_g.toFixed(2)}<br>
        Gold 21K per gram: ${symbol}${prices.gold21_per_g.toFixed(2)}<br>
        Silver per kilogram: ${symbol}${prices.silver_per_kg.toFixed(2)}<br><br>
        Gold per oz: ${symbol}${prices.gold_oz_usd.toFixed(2)}<br>
        Silver per oz: ${symbol}${prices.silver_oz_usd.toFixed(2)}<br><br>
        Total 24K: ${symbol}${totalGold24.toFixed(2)}<br>
        Total 21K: ${symbol}${totalGold21.toFixed(2)}<br>
        Total Silver: ${symbol}${totalSilver.toFixed(2)}<br><br>
        <strong>TOTAL VALUE: ${symbol}${totalValue.toFixed(2)}</strong>
    `;
}

// Auto-refresh every 5 seconds
setInterval(calculate, 5000);
</script>

</body>
</html>
